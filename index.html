<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>淡江大學校園互動導覽地圖 - 平滑漸層光束版</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine (站內導航) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #map {
      height: 100dvh;
      width: 100vw;
      z-index: 10;
      background: #f8fafc;
    }
    
    .leaflet-routing-container {
      display: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 1rem !important;
      padding: 4px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15) !important;
    }
    .leaflet-popup-content {
      margin: 8px 10px !important;
      line-height: 1.4 !important;
      max-width: 82vw !important;
    }

    /* 精緻建築代號圓形標籤 (Building Code Badge) */
    .code-badge-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: #ffffff;
      font-weight: 800;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.12);
      border: 2.5px solid #ffffff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.02em;
    }
    .code-badge-marker:hover {
      transform: scale(1.15);
      z-index: 999 !important;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    /* GPS 定位點與 Google Maps 風格藍色漸層扇形光束 */
    .user-heading-container {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Google Maps 半透明藍色漸層扇形光束 (置於底層 z-index: 1) */
    .user-heading-beam {
      position: absolute;
      top: -6px;
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 44px solid transparent;
      /* CSS Mask 建立柔和漸層扇形光束 */
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.55) 0%, rgba(37, 99, 235, 0.05) 90%);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
      transform-origin: 50% 100%;
      transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1.0);
      pointer-events: none;
      display: none;
      z-index: 1; /* 底層：不遮擋定位中心圓點 */
    }

    /* 中心藍色定位圓點 (頂層 z-index: 10) */
    .user-pulse-marker {
      position: relative;
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
      z-index: 10; /* 最高層級：永遠顯示在光束上方 */
    }
    .user-pulse-marker::after {
      content: '';
      position: absolute;
      top: -9px;
      left: -9px;
      width: 28px;
      height: 28px;
      background-color: rgba(37, 99, 235, 0.35);
      border-radius: 50%;
      animation: pulse-ring 2s infinite ease-out;
      z-index: 9;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans select-none">

  <!-- ======================== 左側/頂部多重篩選控制介面 ======================== -->
  <div class="fixed top-2 sm:top-4 left-2 sm:left-4 right-2 sm:right-auto z-20 flex flex-col gap-1.5 sm:w-88 max-w-full">
    <!-- 主卡片 -->

        <button id="clear-search" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 p-0.5">
          <i class="fa-solid fa-circle-xmark text-sm"></i>
        </button>
      </div>

      <!-- 摺疊切換按鈕 -->

      <!-- 可摺疊收納的進階篩選區塊 -->
      <div id="advanced-filters-panel" class="hidden space-y-2.5 text-xs pt-2.5 mt-1 border-t border-slate-100/80 transition-all">
        <!-- 篩選列 1: 資料類型 & 景點類別 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">資料類型</label>
            <select id="filter-data-type" class="w-full py-1.5 px-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium">

              <option value="office">行政處室/組別</option>
              <option value="place">校園建築與景點</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">景點類別</label>
            <select id="filter-place-cat" class="w-full py-1.5 px-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium">

              <option value="academic">教學學院</option>

              <option value="sport">運動場館</option>

        <!-- 篩選列 2: 辦公室學院 / 單位群組 -->
        <div>

            <option value="all">全部群組</option>

            <option value="總務處">總務處</option>
            <option value="秘書處/校長室">秘書處/校長室</option>

    <span id="toast-msg">通知訊息</span>

  <!-- Leaflet 地圖容器 -->
  <div id="map"></div>

  <script>
    function showToast(msg, icon = 'fa-circle-info', color = 'text-blue-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon} ${color}`;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 3000);
    }

    function createCodeBadgeIcon(place) {
      const codeLen = place.id.length;
      let badgeWidth = 32;
      let badgeHeight = 32;
      let fontSize = '13px';

      if (codeLen === 1) {
        badgeWidth = 30;
        badgeHeight = 30;
        fontSize = '14px';
      } else if (codeLen === 2) {
        badgeWidth = 34;
        badgeHeight = 34;
        fontSize = '12px';
      } else if (codeLen >= 3) {
        badgeWidth = 44;
        badgeHeight = 30;
        fontSize = '10px';
      }

      return L.divIcon({
        className: '',
        html: `
          <div class="code-badge-marker" style="
            background-color: ${place.color}; 
            width: ${badgeWidth}px; 
            height: ${badgeHeight}px; 
            font-size: ${fontSize};
          ">
            ${place.id}
          </div>
        `,
        iconSize: [badgeWidth, badgeHeight],
        iconAnchor: [badgeWidth / 2, badgeHeight / 2],
        popupAnchor: [0, -(badgeHeight / 2 + 4)]
      });
    }

        highlightHtml = `
          <div class="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs">
            <div class="font-bold text-amber-900 flex items-center gap-1">
              <i class="fa-solid fa-crosshairs text-amber-600"></i>
              查詢目標：${highlightedOffice.name}
            </div>
            <div class="text-slate-700 mt-0.5">位置：<span class="font-bold text-red-600 font-mono">${highlightedOffice.room}</span> (${highlightedOffice.group})</div>
          </div>
        `;
      }

      let officesListHtml = '';
      if (officesInPlace.length > 0) {
        officesListHtml = `
          <div class="mt-2 pt-1.5 border-t border-slate-100">
            <details class="group" open>
              <summary class="text-xs font-bold text-slate-500 cursor-pointer flex items-center justify-between py-1 select-none">
                <span>🏢 進駐處室 / 系所 (${officesInPlace.length})</span>
                <i class="fa-solid fa-chevron-down text-[10px] transition-transform group-open:rotate-180"></i>
              </summary>
              <div class="mt-1 space-y-1 max-h-36 overflow-y-auto custom-scroll pr-1">
                ${officesInPlace.map(o => `
                  <div class="flex justify-between items-center text-xs py-0.5 px-1 rounded hover:bg-slate-50">
                    <span class="text-slate-700 truncate pr-1">${o.name}</span>
                    <span class="font-mono text-[11px] font-bold text-red-600 bg-red-50 px-1.5 py-0.2 rounded shrink-0">${o.room}</span>
                  </div>
                `).join('')}
              </div>
            </details>
          </div>
        `;
      }

      return `
        <div class="min-w-[200px] max-w-[270px]">
          ${highlightHtml}
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[11px] px-1.5 py-0.2 rounded-full font-extrabold text-white shadow-sm shrink-0" style="background-color:${place.color};">
              ${place.id}
            </span>
            <h3 class="font-bold text-slate-900 text-sm truncate">${place.name}</h3>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-600 mb-1.5 leading-relaxed">${place.desc}</p>
          ${officesListHtml}
          <button onclick="startNavigation(${place.lat}, ${place.lng}, '${place.name}')" 
                  class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
            <i class="fa-solid fa-person-walking text-xs"></i> 步行前往此處
          </button>
        </div>
      `;
    }

    function initMarkers() {
      campusPlaces.forEach(place => {
        const marker = L.marker([place.lat, place.lng], {
          icon: createCodeBadgeIcon(place)
        });
        marker.bindPopup(getPopupHtml(place), {
          autoPanPadding: [20, 80]
        });
        markersLayer.addLayer(marker);
        markersById[place.id] = marker;
      });
    }
    initMarkers();

    function populateBuildingSelect() {
      const select = document.getElementById('filter-building');
      campusPlaces.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = `${p.id} - ${p.name}`;
        select.appendChild(opt);
      });
    }
    populateBuildingSelect();

    // 5. 折疊與多重篩選控制器
    const keywordInput = document.getElementById('filter-keyword');
    const dataTypeSelect = document.getElementById('filter-data-type');
    const placeCatSelect = document.getElementById('filter-place-cat');
    const groupSelect = document.getElementById('filter-group');
    const buildingSelect = document.getElementById('filter-building');
    const clearSearchBtn = document.getElementById('clear-search');
    const resultsContainer = document.getElementById('results-container');
    const filterStats = document.getElementById('filter-stats');
    const advPanel = document.getElementById('advanced-filters-panel');
    const arrowIcon = document.getElementById('toggle-arrow-icon');
    const activeIndicator = document.getElementById('active-filter-indicator');

    function toggleAdvancedFilters() {
      const isHidden = advPanel.classList.contains('hidden');
      if (isHidden) {
        advPanel.classList.remove('hidden');
        arrowIcon.classList.add('rotate-180');
      } else {
        advPanel.classList.add('hidden');
        arrowIcon.classList.remove('rotate-180');
      }
    }

    function applyFilters() {
      const kw = keywordInput.value.trim().toLowerCase();
      const dataType = dataTypeSelect.value;
      const placeCat = placeCatSelect.value;
      const group = groupSelect.value;
      const buildingId = buildingSelect.value;

      if (kw) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }

      let activeFilterCount = 0;
      if (dataType !== 'all') activeFilterCount++;
      if (placeCat !== 'all') activeFilterCount++;
      if (group !== 'all') activeFilterCount++;
      if (buildingId !== 'all') activeFilterCount++;

      if (activeFilterCount > 0) {
        activeIndicator.classList.remove('hidden');
        activeIndicator.innerText = `● 已選 ${activeFilterCount} 項`;
      } else {
        activeIndicator.classList.add('hidden');
      }

      let matchedOffices = campusOffices.filter(o => {
        if (dataType === 'place') return false;
        if (group !== 'all' && o.group !== group) return false;
        if (buildingId !== 'all' && o.targetId !== buildingId) return false;
        if (kw) {
          const matchKw = o.name.toLowerCase().includes(kw) || 
                          o.room.toLowerCase().includes(kw) || 
                          o.group.toLowerCase().includes(kw) || 
                          o.building.toLowerCase().includes(kw) ||
                          (kw.includes('健康中心') && o.name.includes('衛生保健'));
          if (!matchKw) return false;
        }
        return true;
      });

      let matchedPlaces = campusPlaces.filter(p => {
        if (dataType === 'office') return false;
        if (placeCat !== 'all' && p.cat !== placeCat) return false;
        if (buildingId !== 'all' && p.id !== buildingId) return false;
        if (kw) {
          const matchKw = p.name.toLowerCase().includes(kw) || 
                          p.id.toLowerCase().includes(kw) || 
                          p.desc.toLowerCase().includes(kw);
          if (!matchKw) return false;
        }
        return true;
      });

      const activePlaceIds = new Set([
        ...matchedPlaces.map(p => p.id),
        ...matchedOffices.map(o => o.targetId)
      ]);

      markersLayer.clearLayers();
      campusPlaces.forEach(place => {
        if (activePlaceIds.has(place.id)) {
          markersLayer.addLayer(markersById[place.id]);
        }
      });

      renderResultsList(matchedOffices, matchedPlaces);
    }

    function renderResultsList(offices, places) {
      const isFiltered = keywordInput.value.trim() !== '' || 
                         dataTypeSelect.value !== 'all' || 
                         placeCatSelect.value !== 'all' || 
                         groupSelect.value !== 'all' || 
                         buildingSelect.value !== 'all';

      if (!isFiltered) {
        resultsContainer.classList.add('hidden');
        filterStats.innerText = "顯示全部項目";
        return;
      }

      resultsContainer.classList.remove('hidden');
      resultsContainer.innerHTML = '';
      const totalCount = offices.length + places.length;
      filterStats.innerText = `符合：${totalCount} 項`;

      if (totalCount === 0) {
        resultsContainer.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">找不到相符的項目，請嘗試放寬條件</div>`;
        return;
      }

      if (offices.length > 0) {
        const title = document.createElement('div');
        title.className = "text-[11px] font-bold text-slate-400 px-2 pt-1";
        title.innerText = `行政處室 / 學術系所 (${offices.length})`;
        resultsContainer.appendChild(title);

        offices.forEach(office => {
          const item = document.createElement('div');
          item.className = "p-2 hover:bg-blue-50 rounded-xl cursor-pointer flex flex-col transition border border-transparent hover:border-blue-100";
          item.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800 text-xs">${office.name}</span>
              <span class="text-xs font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded font-mono">${office.room}</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5 flex items-center justify-between">
              <span><i class="fa-solid fa-location-dot text-slate-400 text-[10px]"></i> 位於：${office.building}</span>
              <span class="bg-slate-100 text-slate-600 px-1.5 rounded text-[10px]">${office.group}</span>
            </div>
          `;
          item.onclick = () => {
            const place = campusPlaces.find(p => p.id === office.targetId);
            if (place) {
              const marker = markersById[place.id];
              map.flyTo([place.lat, place.lng], 18, { duration: 1 });
              marker.setPopupContent(getPopupHtml(place, office));
              setTimeout(() => marker.openPopup(), 600);
              resultsContainer.classList.add('hidden');
            }
          };
          resultsContainer.appendChild(item);
        });
      }

      if (places.length > 0) {
        const title = document.createElement('div');
        title.className = "text-[11px] font-bold text-slate-400 px-2 pt-2";
        title.innerText = `校園建築與景點 (${places.length})`;
        resultsContainer.appendChild(title);

        places.forEach(place => {
          const item = document.createElement('div');
          item.className = "p-2 hover:bg-slate-100 rounded-xl cursor-pointer flex items-center justify-between transition";
          item.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black text-white shrink-0" style="background-color:${place.color};">${place.id}</span>
              <span class="font-bold text-slate-800 text-xs">${place.name}</span>
            </div>
            <span class="text-[10px] text-slate-400 font-mono">前往地號</span>
          `;
          item.onclick = () => {
            const marker = markersById[place.id];
            map.flyTo([place.lat, place.lng], 18, { duration: 1 });
            marker.setPopupContent(getPopupHtml(place));
            setTimeout(() => marker.openPopup(), 600);
            resultsContainer.classList.add('hidden');
          };
          resultsContainer.appendChild(item);
        });
      }
    }

    [keywordInput, dataTypeSelect, placeCatSelect, groupSelect, buildingSelect].forEach(elem => {
      elem.addEventListener('input', applyFilters);
      elem.addEventListener('change', applyFilters);
    });

    clearSearchBtn.addEventListener('click', () => {
      keywordInput.value = '';
      applyFilters();
    });

    function resetFilters() {
      keywordInput.value = '';
      dataTypeSelect.value = 'all';
      placeCatSelect.value = 'all';
      groupSelect.value = 'all';
      buildingSelect.value = 'all';
      applyFilters();
      showToast("已重設所有搜尋與篩選條件", "fa-rotate-left", "text-blue-400");
    }

    map.on('dragstart', () => {
      if (!advPanel.classList.contains('hidden')) {
        advPanel.classList.add('hidden');
        arrowIcon.classList.remove('rotate-180');
      }
    });

    // 6. ★ 低通濾波平滑羅盤與正確 Z-Index 圖層 (Smooth Low-pass Compass Beam)
    let userMarker = null;
    let userAccuracyCircle = null;
    let userLatLng = null;
    let hasCenteredFirstTime = false;
    let watchId = null;

    // 低通濾波過濾變數
    let filteredHeading = null;
    const filterAlpha = 0.15; // 平滑指數（值越小越平滑，徹底過濾抖動）
    const minThresholdDeg = 3.0; // 最小角度更新門檻（3 度以下震盪無視）

    function startAutoLocationTracking() {
      const statusBadge = document.getElementById('gps-status-badge');

      if (!navigator.geolocation) {
        statusBadge.className = "text-[10px] sm:text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-bold";
        statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 不支援 GPS';
        showToast("裝置不支援定位功能，已預設顯示淡江校園", "fa-triangle-exclamation", "text-amber-400");
        return;
      }

      initDeviceOrientation();

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          userLatLng = [lat, lng];

          if (!userMarker) {
            // 正確圖層架構：光束 (z-index:1) 於底層，藍色脈衝點 (z-index:10) 於頂層
            const userCustomIcon = L.divIcon({
              className: '',
              html: `
                <div class="user-heading-container">
                  <div id="user-heading-beam" class="user-heading-beam"></div>
                  <div class="user-pulse-marker"></div>
                </div>
              `,
              iconSize: [64, 64],
              iconAnchor: [32, 32]
            });

            userMarker = L.marker(userLatLng, { icon: userCustomIcon, zIndexOffset: 1000 }).addTo(map);
            userMarker.bindTooltip("我的目前位置", { permanent: false, direction: 'top' });

            userAccuracyCircle = L.circle(userLatLng, {
              radius: accuracy,
              color: '#3b82f6',
              weight: 1,
              fillColor: '#60a5fa',
              fillOpacity: 0.15
            }).addTo(map);
          } else {
            userMarker.setLatLng(userLatLng);
            if (userAccuracyCircle) {
              userAccuracyCircle.setLatLng(userLatLng);
              userAccuracyCircle.setRadius(accuracy);
            }
          }

          if (!hasCenteredFirstTime) {
            hasCenteredFirstTime = true;
            map.flyTo(userLatLng, 18, { duration: 1.2 });
            showToast("已自動為您定位並置中", "fa-circle-check", "text-emerald-400");
          }

          statusBadge.className = "text-[10px] sm:text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold flex items-center gap-1";
          statusBadge.innerHTML = '<i class="fa-solid fa-location-dot"></i> GPS 已連線';
        },
        (err) => {
          statusBadge.className = "text-[10px] sm:text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold flex items-center gap-1";
          statusBadge.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> 點擊手動定位';
          
          if (!hasCenteredFirstTime) {
            hasCenteredFirstTime = true;
            showToast("若需即時定位，請允許瀏覽器位置存取權限", "fa-location-arrow", "text-blue-400");
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );
    }

    // 裝置羅盤（DeviceOrientation）平滑濾波演算法
    function initDeviceOrientation() {
      const handleOrientation = (e) => {
        let rawHeading = null;

        if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
          rawHeading = e.webkitCompassHeading;
        } else if (e.alpha !== null && e.alpha !== undefined) {
          rawHeading = 360 - e.alpha;
        }

        if (rawHeading !== null) {
          // 首次傳回數據初始化
          if (filteredHeading === null) {
            filteredHeading = rawHeading;
          } else {
            // 正確處理 0° / 360° 邊界差值
            let diff = rawHeading - filteredHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            // 門檻過濾：當變動幅度大於 3 度時才計算平滑值，避免手晃抖動
            if (Math.abs(diff) >= minThresholdDeg) {
              filteredHeading = filteredHeading + filterAlpha * diff;
              filteredHeading = (filteredHeading + 360) % 360;
            }
          }

          updateBeamRotation(filteredHeading);
        }
      };

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
            }
          })
          .catch(console.error);
      } else {
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else if ('ondeviceorientation' in window) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }
    }

    // 更新藍色漸層扇形光束角度
    function updateBeamRotation(deg) {
      const beamElem = document.getElementById('user-heading-beam');
      if (beamElem) {
        beamElem.style.display = 'block';
        beamElem.style.transform = `rotate(${deg}deg)`;
      }
    }

    function recenterUser() {
      const btn = document.getElementById('locate-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-base"></i>';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            initDeviceOrientation();
          }
        }).catch(() => {});
      }

      if (userLatLng) {
        map.flyTo(userLatLng, 18, { duration: 1 });
        showToast("已置中至目前位置", "fa-crosshairs", "text-blue-400");
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
        }, 600);
      } else {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLatLng = [pos.coords.latitude, pos.coords.longitude];
            if (!userMarker) {
              const userCustomIcon = L.divIcon({
                className: '',
                html: `
                  <div class="user-heading-container">
                    <div id="user-heading-beam" class="user-heading-beam"></div>
                    <div class="user-pulse-marker"></div>
                  </div>
                `,
                iconSize: [64, 64],
                iconAnchor: [32, 32]
              });
              userMarker = L.marker(userLatLng, { icon: userCustomIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
              userMarker.setLatLng(userLatLng);
            }
            map.flyTo(userLatLng, 18, { duration: 1.2 });
            showToast("已成功定位", "fa-circle-check", "text-emerald-400");
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
          },
          (err) => {
            showToast("無法取得定位，請檢查手機 GPS 是否已開啟", "fa-triangle-exclamation", "text-red-400");
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    }

    // 7. 站內步行導航
    let routingControl = null;

    function startNavigation(destLat, destLng, destName) {
      map.closePopup();

      if (!userLatLng) {
        showToast("正在確認起點座標...", "fa-location-arrow", "text-blue-400");
        recenterUser();
        return;
      }

      runRouting(destLat, destLng, destName);
    }

    function runRouting(destLat, destLng, destName) {
      if (routingControl) {
        map.removeControl(routingControl);
      }

      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.remove('hidden');
      navBanner.classList.add('flex');
      document.getElementById('nav-target-name').innerText = `目的地：${destName}`;
      document.getElementById('nav-distance').innerText = "規劃中...";
      document.getElementById('nav-time').innerText = "";
      
      const gmapsBtn = document.getElementById('nav-gmaps-btn');
      gmapsBtn.onclick = () => {
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLatLng[0]},${userLatLng[1]}&destination=${destLat},${destLng}&travelmode=walking`, '_blank');
      };

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLatLng[0], userLatLng[1]),
          L.latLng(destLat, destLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
          profile: 'foot'
        }),
        lineOptions: {
          styles: [
            { color: '#2563eb', opacity: 0.9, weight: 6 }
          ]
        },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        show: false,
        createMarker: function() { return null; }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        const summary = routes[0].summary;
        const meters = Math.round(summary.totalDistance);
        const minutes = Math.max(1, Math.round(summary.totalTime / 60));

        document.getElementById('nav-distance').innerText = `${meters} 公尺`;
        document.getElementById('nav-time').innerText = `(步行約 ${minutes} 分鐘)`;
        
        if (routes[0].instructions && routes[0].instructions.length > 0) {
          const firstStep = routes[0].instructions[0].text;
          document.getElementById('nav-step').innerText = firstStep || "沿著步道前進";
        }
      });

      routingControl.on('routingerror', function() {
        const directDist = Math.round(map.distance(userLatLng, [destLat, destLng]));
        const directMin = Math.max(1, Math.round(directDist / 70));
        document.getElementById('nav-distance').innerText = `約 ${directDist} 公尺 (直線)`;
        document.getElementById('nav-time').innerText = `(步程約 ${directMin} 分鐘)`;
        document.getElementById('nav-step').innerText = "請參考 Google Maps 路線";
      });
    }

    function cancelNavigation() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.add('hidden');
      navBanner.classList.remove('flex');
    }

    // 頁面載入觸發定位與初始化
    window.addEventListener('DOMContentLoaded', () => {
      startAutoLocationTracking();
    });
  </script>
</body>
</html>
