<head>

  <title>淡江大學校園互動導覽地圖 | TKU Campus Map</title>

  <!-- 瀏覽器分頁圖示 (Favicon) 設定 -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine (站內導航) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #map {
      height: 100dvh;
      width: 100vw;
      z-index: 10;
      background: #f8fafc;
    }
    
    .leaflet-routing-container {
      display: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 1rem !important;
      padding: 4px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15) !important;
    }
    .leaflet-popup-content {
      margin: 8px 10px !important;
      line-height: 1.4 !important;
      max-width: 82vw !important;
    }

    /* 調整 Leaflet 右上角控制項位置，避免被語言切換按鈕擋住 */
    .leaflet-top.leaflet-right {
      margin-top: 52px !important;
    }

    /* 精緻建築代號圓形標籤 (Building Code Badge) */
    .code-badge-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: #ffffff;
      font-weight: 800;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.12);
      border: 2.5px solid #ffffff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.02em;
    }
    .code-badge-marker:hover {
      transform: scale(1.15);
      z-index: 999 !important;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    /* GPS 脈衝動態光圈 */
    .user-pulse-marker {
      position: relative;
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37,99,235,0.8);
    }
    .user-pulse-marker::after {
      content: '';
      position: absolute;
      top: -9px;
      left: -9px;
      width: 28px;
      height: 28px;
      background-color: rgba(37, 99, 235, 0.35);
      border-radius: 50%;
      animation: pulse-ring 2s infinite ease-out;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans select-none">

  <!-- ======================== 右上角語言切換按鈕 ======================== -->
<div class="fixed top-2.5 sm:top-2.5 right-14 sm:right-16 z-30">
    <button 
      id="lang-toggle-btn" 
      onclick="toggleLanguage()" 
      class="bg-white/95 hover:bg-slate-50 backdrop-blur-md text-slate-700 border border-slate-200/90 px-3 py-1.5 sm:py-2 rounded-xl shadow-lg text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95"
      title="Switch Language / 切換語言"
    >
      <i class="fa-solid fa-globe text-blue-600 text-sm"></i>
      <span id="lang-btn-text">EN</span>
    </button>
  </div>

  <!-- ======================== 左側/頂部多重篩選控制介面 ======================== -->
  <div class="fixed top-12 sm:top-4 left-2 sm:left-4 right-2 sm:right-auto z-20 flex flex-col gap-1.5 sm:w-88 max-w-full">
    <!-- 主卡片 -->
    <div class="bg-white/95 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-xl border border-slate-200/90 transition-all max-h-[82vh] overflow-y-auto custom-scroll">
      
      <!-- 標題與標籤 -->
      <div class="flex items-center justify-between mb-1">
        <h1 class="text-sm sm:text-base font-black text-slate-800 flex items-center gap-1.5">
          <img src="favicon.png" alt="Logo" class="w-6 h-6 rounded-full shrink-0 animate-pulse border border-slate-200" />
          <span id="ui-app-title">淡江不麋鹿</span>
        </h1>
        <span id="gps-status-badge" class="text-[10px] sm:text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shrink-0">
          <i class="fa-solid fa-satellite-dish text-[9px] animate-pulse"></i>
          <span id="gps-status-text">自動定位中</span>
        </span>
      </div>
      <p id="ui-app-subtitle" class="text-[10px] sm:text-[11px] text-slate-500 mb-2">景點與辦公室共用同一個查詢介面。</p>

      <!-- 關鍵字搜尋 -->

        <input 
          type="text" 
          id="filter-keyword" 
          placeholder="例如：B304、出納組、失物招領、TH"

        />
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        <button id="clear-search" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 p-0.5">
          <i class="fa-solid fa-circle-xmark text-sm"></i>
        </button>
      </div>

      <!-- 摺疊切換按鈕 -->
      <div class="mt-2 pt-1.5 flex items-center justify-between border-t border-slate-100">
        <button id="toggle-filters-btn" onclick="toggleAdvancedFilters()" class="text-xs font-bold text-slate-600 hover:text-red-600 flex items-center gap-1.5 py-0.5 transition">

      </div>

      <div id="advanced-filters-panel" class="hidden space-y-2.5 text-xs pt-2.5 mt-1 border-t border-slate-100/80 transition-all">
        <!-- 篩選列 1: 資料類型 & 景點類別 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="ui-label-datatype" class="block font-bold text-slate-700 mb-1">資料類型</label>
            <select id="filter-data-type" class="w-full py-1.5 px-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium">

              <option value="place">校園建築與景點</option>
            </select>
          </div>

          <div>

              <option value="all">全部類別</option>
              <option value="academic">教學學院</option>
              <option value="admin">行政/圖書</option>
              <option value="sport">運動場館</option>
              <option value="life">生活景觀</option>

        </div>

            <option value="all">全部群組</option>
            <option value="教務處">教務處</option>
            <option value="學務處">學務處</option>
            <option value="總務處">總務處</option>
            <option value="秘書處/校長室">秘書處/校長室</option>
            <option value="國際處/國際學院">國際處/國際學院</option>

            <option value="外語學院">外語學院</option>

        </div>

            <option value="all">全部建築物</option>

        </div>

        <!-- 條件重設按鈕 -->
        <div class="pt-1 flex items-center justify-end">

          </button>
        </div>
      </div>
    </div>

    <!-- 智慧搜尋連動清單結果 -->
    <div id="results-container" class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl max-h-48 sm:max-h-60 overflow-y-auto p-2 border border-slate-200/90 space-y-1.5 text-xs sm:text-sm custom-scroll hidden"></div>

  <!-- 導航資訊浮動卡 -->

      <span class="text-xs font-bold text-blue-600 flex items-center gap-1">

        <i class="fa-solid fa-xmark"></i>

    <div>

    </div>
    <div class="text-[11px] text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100 flex items-center gap-2">

    <div class="flex gap-2 mt-0.5">

    // 雙語欄位取值輔助函式
    function getPlaceName(p) { return currentLang === 'en' ? (p.nameEn || p.name) : p.name; }
    function getPlaceDesc(p) { return currentLang === 'en' ? (p.descEn || p.desc) : p.desc; }
    function getOfficeName(o) { return currentLang === 'en' ? (o.nameEn || o.name) : o.name; }
    function getOfficeBuilding(o) { return currentLang === 'en' ? (o.buildingEn || o.building) : o.building; }
    function getGroupName(g) { return currentLang === 'en' ? (groupTranslations[g] || g) : g; }

    function showToast(msg, icon = 'fa-circle-info', color = 'text-blue-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastLogo = document.getElementById('toast-logo');
      
      toastMsg.innerText = msg;
      if (icon === 'fa-triangle-exclamation' || icon === 'fa-circle-check') {
        toastLogo.style.display = 'none';
        let customIcon = document.getElementById('toast-custom-icon');
        if (!customIcon) {
          customIcon = document.createElement('i');
          customIcon.id = 'toast-custom-icon';
          toast.insertBefore(customIcon, toastMsg);
        }
        customIcon.className = `fa-solid ${icon} ${color}`;
        customIcon.style.display = 'inline-block';
      } else {
        toastLogo.style.display = 'inline-block';
        const customIcon = document.getElementById('toast-custom-icon');
        if (customIcon) customIcon.style.display = 'none';
      }

      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 3000);
    }

    // 3. 地圖初始化
    const isMobile = window.innerWidth < 640;
    const campusCenter = [25.1752, 121.4503];
    const map = L.map('map', { 
      zoomControl: false,
      maxBounds: [
        [25.1680, 121.4390],
        [25.1820, 121.4620]
      ],
      maxBoundsViscosity: 0.8
    }).setView(campusCenter, isMobile ? 16 : 17);

    const emap8 = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP8/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      maxZoom: 20,
      attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">NLSC Taiwan</a>'
    }).addTo(map);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    L.control.layers({
      "EMAP8 (No Labels)": emap8,
      "OpenStreetMap": osm
    }, null, { position: 'topright' }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    function createCodeBadgeIcon(place) {
      const codeLen = place.id.length;
      let badgeWidth = 32;
      let badgeHeight = 32;
      let fontSize = '13px';

      if (codeLen === 1) {
        badgeWidth = 30;
        badgeHeight = 30;
        fontSize = '14px';
      } else if (codeLen === 2) {
        badgeWidth = 34;
        badgeHeight = 34;
        fontSize = '12px';
      } else if (codeLen >= 3) {
        badgeWidth = 44;
        badgeHeight = 30;
        fontSize = '10px';
      }

      return L.divIcon({
        className: '',
        html: `
          <div class="code-badge-marker" style="
            background-color: ${place.color}; 
            width: ${badgeWidth}px; 
            height: ${badgeHeight}px; 
            font-size: ${fontSize};
          ">
            ${place.id}
          </div>
        `,
        iconSize: [badgeWidth, badgeHeight],
        iconAnchor: [badgeWidth / 2, badgeHeight / 2],
        popupAnchor: [0, -(badgeHeight / 2 + 4)]
      });
    }

    function getPopupHtml(place, highlightedOffice = null) {
      const t = i18n[currentLang];
      const officesInPlace = campusOffices.filter(o => o.targetId === place.id);
      const pName = getPlaceName(place);
      const pDesc = getPlaceDesc(place);
      
      let highlightHtml = '';
      if (highlightedOffice) {
        highlightHtml = `
          <div class="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs">
            <div class="font-bold text-amber-900 flex items-center gap-1">
              <i class="fa-solid fa-crosshairs text-amber-600"></i>
              ${t.popupTarget}${getOfficeName(highlightedOffice)}
            </div>
            <div class="text-slate-700 mt-0.5">${t.popupLocation}<span class="font-bold text-red-600 font-mono">${highlightedOffice.room}</span> (${getGroupName(highlightedOffice.group)})</div>
          </div>
        `;
      }

      let officesListHtml = '';
      if (officesInPlace.length > 0) {
        officesListHtml = `
          <div class="mt-2 pt-1.5 border-t border-slate-100">
            <details class="group" open>
              <summary class="text-xs font-bold text-slate-500 cursor-pointer flex items-center justify-between py-1 select-none">
                <span>${t.popupOfficesHeader(officesInPlace.length)}</span>
                <i class="fa-solid fa-chevron-down text-[10px] transition-transform group-open:rotate-180"></i>
              </summary>
              <div class="mt-1 space-y-1 max-h-36 overflow-y-auto custom-scroll pr-1">
                ${officesInPlace.map(o => `
                  <div class="flex justify-between items-center text-xs py-0.5 px-1 rounded hover:bg-slate-50">
                    <span class="text-slate-700 truncate pr-1" title="${getOfficeName(o)}">${getOfficeName(o)}</span>
                    <span class="font-mono text-[11px] font-bold text-red-600 bg-red-50 px-1.5 py-0.2 rounded shrink-0">${o.room}</span>
                  </div>
                `).join('')}
              </div>
            </details>
          </div>
        `;
      }

      return `
        <div class="min-w-[200px] max-w-[270px]">
          ${highlightHtml}
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[11px] px-1.5 py-0.2 rounded-full font-extrabold text-white shadow-sm shrink-0" style="background-color:${place.color};">
              ${place.id}
            </span>
            <h3 class="font-bold text-slate-900 text-sm truncate" title="${pName}">${pName}</h3>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-600 mb-1.5 leading-relaxed">${pDesc}</p>
          ${officesListHtml}
          <button onclick="startNavigation(${place.lat}, ${place.lng}, '${place.id}')" 
                  class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
            <i class="fa-solid fa-person-walking text-xs"></i> ${t.popupWalkBtn}
          </button>

    function applyFilters() {
      const t = i18n[currentLang];
      const kw = keywordInput.value.trim().toLowerCase();
      const dataType = dataTypeSelect.value;
      const placeCat = placeCatSelect.value;
      const group = groupSelect.value;
      const buildingId = buildingSelect.value;

      if (kw) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }

      let activeFilterCount = 0;
      if (dataType !== 'all') activeFilterCount++;
      if (placeCat !== 'all') activeFilterCount++;
      if (group !== 'all') activeFilterCount++;
      if (buildingId !== 'all') activeFilterCount++;

      if (activeFilterCount > 0) {
        activeIndicator.classList.remove('hidden');
        activeIndicator.innerText = t.activeFilters(activeFilterCount);
      } else {
        activeIndicator.classList.add('hidden');
      }

      let matchedOffices = campusOffices.filter(o => {
        if (dataType === 'place') return false;
        if (group !== 'all' && o.group !== group) return false;
        if (buildingId !== 'all' && o.targetId !== buildingId) return false;
        if (kw) {
          const bracketMatch = o.name.match(/\((.*?)\)/);
          const bracketText = bracketMatch ? bracketMatch[1].toLowerCase() : '';
          const bracketEnMatch = (o.nameEn || '').match(/\((.*?)\)/);
          const bracketEnText = bracketEnMatch ? bracketEnMatch[1].toLowerCase() : '';

          const matchKw = o.name.toLowerCase().includes(kw) || 
                          (o.nameEn || '').toLowerCase().includes(kw) ||
                          bracketText.includes(kw) ||
                          bracketEnText.includes(kw) ||
                          o.room.toLowerCase().includes(kw) || 
                          o.group.toLowerCase().includes(kw) || 
                          (groupTranslations[o.group] || '').toLowerCase().includes(kw) ||
                          o.building.toLowerCase().includes(kw) ||
                          (o.buildingEn || '').toLowerCase().includes(kw) ||
                          (kw.includes('健康中心') && o.name.includes('衛生保健'));
          if (!matchKw) return false;
        }
        return true;
      });

      let matchedPlaces = campusPlaces.filter(p => {
        if (dataType === 'office') return false;
        if (placeCat !== 'all' && p.cat !== placeCat) return false;
        if (buildingId !== 'all' && p.id !== buildingId) return false;
        if (kw) {
          const matchKw = p.name.toLowerCase().includes(kw) || 
                          (p.nameEn || '').toLowerCase().includes(kw) ||
                          p.id.toLowerCase().includes(kw) || 
                          p.desc.toLowerCase().includes(kw) ||
                          (p.descEn || '').toLowerCase().includes(kw);
          if (!matchKw) return false;
        }
        return true;
      });

      const activePlaceIds = new Set([
        ...matchedPlaces.map(p => p.id),
        ...matchedOffices.map(o => o.targetId)
      ]);

      markersLayer.clearLayers();
      campusPlaces.forEach(place => {
        if (activePlaceIds.has(place.id)) {

      renderResultsList(matchedOffices, matchedPlaces);

    // 6. 純 GPS 即時定位追蹤
    let userMarker = null;
    let userAccuracyCircle = null;
    let userLatLng = null;
    let hasCenteredFirstTime = false;
    let watchId = null;

    function startAutoLocationTracking() {
      const t = i18n[currentLang];

      if (!navigator.geolocation) {
        gpsState = 'unsupported';
        updateGpsBadgeUI();
        showToast(t.toastUnsupported, "fa-triangle-exclamation", "text-amber-400");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          userLatLng = [lat, lng];

          if (!userMarker) {
            const userCustomIcon = L.divIcon({
              className: '',
              html: `<div class="user-pulse-marker"></div>`,
              iconSize: [16, 16],
              iconAnchor: [8, 8]
            });

            userMarker = L.marker(userLatLng, { icon: userCustomIcon, zIndexOffset: 1000 }).addTo(map);
            userMarker.bindTooltip(i18n[currentLang].myLocationTooltip, { permanent: false, direction: 'top' });

            userAccuracyCircle = L.circle(userLatLng, {
              radius: accuracy,
              color: '#3b82f6',
              weight: 1,
              fillColor: '#60a5fa',
              fillOpacity: 0.15
            }).addTo(map);
          } else {
            userMarker.setLatLng(userLatLng);
            if (userAccuracyCircle) {
              userAccuracyCircle.setLatLng(userLatLng);
              userAccuracyCircle.setRadius(accuracy);
            }
          }

          if (!hasCenteredFirstTime) {
            hasCenteredFirstTime = true;
            map.flyTo(userLatLng, 18, { duration: 1.2 });
            showToast(i18n[currentLang].toastAutoCentered, "fa-circle-check", "text-emerald-400");
          }

          gpsState = 'connected';
          updateGpsBadgeUI();

          if (typeof updateProgressPolyline === 'function') {
            updateProgressPolyline();
          }
        },
        (err) => {
          gpsState = 'manual';
          updateGpsBadgeUI();
          
          if (!hasCenteredFirstTime) {
            hasCenteredFirstTime = true;
            showToast(i18n[currentLang].toastNeedPerm, "fa-location-arrow", "text-blue-400");
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );
    }

    function recenterUser() {
      const btn = document.getElementById('locate-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-base"></i>';

      if (userLatLng) {
        map.flyTo(userLatLng, 18, { duration: 1 });
        showToast(i18n[currentLang].toastRecentered, "fa-crosshairs", "text-blue-400");
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
        }, 600);
      } else {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLatLng = [pos.coords.latitude, pos.coords.longitude];
            if (!userMarker) {
              const userCustomIcon = L.divIcon({
                className: '',
                html: `<div class="user-pulse-marker"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              });
              userMarker = L.marker(userLatLng, { icon: userCustomIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
              userMarker.setLatLng(userLatLng);
            }
            map.flyTo(userLatLng, 18, { duration: 1.2 });
            showToast(i18n[currentLang].toastLocated, "fa-circle-check", "text-emerald-400");
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
          },
          (err) => {
            showToast(i18n[currentLang].toastGpsError, "fa-triangle-exclamation", "text-red-400");
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    }

    // 7. 站內步行導航（含走過路段變灰色機制）
    let routingControl = null;
    let fullRouteCoords = [];
    let passedPolyline = null;
    let remainingPolyline = null;
    let activeDestPlaceId = null;

    function startNavigation(destLat, destLng, placeId) {
      map.closePopup();

      if (!userLatLng) {
        showToast(i18n[currentLang].toastFindingOrigin, "fa-location-arrow", "text-blue-400");
        recenterUser();
        return;
      }

      activeDestPlaceId = placeId;
      const destPlace = campusPlaces.find(p => p.id === placeId);
      const destName = destPlace ? getPlaceName(destPlace) : placeId;
      runRouting(destLat, destLng, destName);
    }

    function getClosestPointOnSegment(p, p1, p2) {
      const x = p.lng, y = p.lat;
      const x1 = p1.lng, y1 = p1.lat;
      const x2 = p2.lng, y2 = p2.lat;

      const dx = x2 - x1;
      const dy = y2 - y1;

      if (dx === 0 && dy === 0) {
        return { point: L.latLng(y1, x1), distSq: (x - x1) ** 2 + (y - y1) ** 2, t: 0 };
      }

      let t = ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy);
      t = Math.max(0, Math.min(1, t));

      const projX = x1 + t * dx;
      const projY = y1 + t * dy;

      return {
        point: L.latLng(projY, projX),
        distSq: (x - projX) ** 2 + (y - projY) ** 2,
        t: t
      };
    }

    function updateProgressPolyline() {
      if (!userLatLng || fullRouteCoords.length < 2) return;

      const currentPoint = L.latLng(userLatLng[0], userLatLng[1]);
      let minDistSq = Infinity;
      let closestSegIndex = 0;
      let closestProjectedPoint = fullRouteCoords[0];

      for (let i = 0; i < fullRouteCoords.length - 1; i++) {
        const segRes = getClosestPointOnSegment(currentPoint, fullRouteCoords[i], fullRouteCoords[i + 1]);
        if (segRes.distSq < minDistSq) {
          minDistSq = segRes.distSq;
          closestSegIndex = i;
          closestProjectedPoint = segRes.point;
        }
      }

      const passedPoints = fullRouteCoords.slice(0, closestSegIndex + 1);
      passedPoints.push(closestProjectedPoint);

      const remainingPoints = [closestProjectedPoint, ...fullRouteCoords.slice(closestSegIndex + 1)];

      if (!passedPolyline) {
        passedPolyline = L.polyline(passedPoints, {
          color: '#94a3b8',
          weight: 6,
          opacity: 0.75,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);
      } else {
        passedPolyline.setLatLngs(passedPoints);
      }

      if (!remainingPolyline) {
        remainingPolyline = L.polyline(remainingPoints, {
          color: '#2563eb',
          weight: 6,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);
      } else {
        remainingPolyline.setLatLngs(remainingPoints);
      }
    }

    function runRouting(destLat, destLng, destName) {
      cancelNavigationLayers();
      const t = i18n[currentLang];

      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.remove('hidden');
      navBanner.classList.add('flex');
      document.getElementById('nav-target-name').innerText = t.navDest(destName);
      document.getElementById('nav-distance').innerText = t.navPlanning;
      document.getElementById('nav-time').innerText = "";
      
      const gmapsBtn = document.getElementById('nav-gmaps-btn');
      gmapsBtn.onclick = () => {
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLatLng[0]},${userLatLng[1]}&destination=${destLat},${destLng}&travelmode=walking`, '_blank');
      };

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLatLng[0], userLatLng[1]),
          L.latLng(destLat, destLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
          profile: 'foot'
        }),
        lineOptions: {
          styles: [{ color: 'transparent', opacity: 0 }]
        },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        show: false,
        createMarker: function() { return null; }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const curT = i18n[currentLang];
        const routes = e.routes;
        const summary = routes[0].summary;
        const meters = Math.round(summary.totalDistance);
        const minutes = Math.max(1, Math.round(summary.totalTime / 60));

        document.getElementById('nav-distance').innerText = curT.navMeters(meters);
        document.getElementById('nav-time').innerText = curT.navTime(minutes);
        
        if (routes[0].instructions && routes[0].instructions.length > 0) {
          const firstStep = routes[0].instructions[0].text;
          document.getElementById('nav-step').innerText = firstStep || curT.navDefaultStep;
        }

        fullRouteCoords = routes[0].coordinates.map(c => L.latLng(c.lat, c.lng));
        updateProgressPolyline();
      });

      routingControl.on('routingerror', function() {
        const curT = i18n[currentLang];
        const directDist = Math.round(map.distance(userLatLng, [destLat, destLng]));
        const directMin = Math.max(1, Math.round(directDist / 70));
        document.getElementById('nav-distance').innerText = curT.navApproxMeters(directDist);
        document.getElementById('nav-time').innerText = curT.navTime(directMin);
        document.getElementById('nav-step').innerText = curT.navFallbackStep;

        fullRouteCoords = [
          L.latLng(userLatLng[0], userLatLng[1]),
          L.latLng(destLat, destLng)
        ];
        updateProgressPolyline();
      });
    }

    function cancelNavigationLayers() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      if (passedPolyline) {
        map.removeLayer(passedPolyline);
        passedPolyline = null;
      }
      if (remainingPolyline) {
        map.removeLayer(remainingPolyline);
        remainingPolyline = null;
      }
      fullRouteCoords = [];
    }

    function cancelNavigation() {
      cancelNavigationLayers();
      activeDestPlaceId = null;
      const navBanner = document.getElementById('nav-banner');
      navBanner.classList.add('hidden');
      navBanner.classList.remove('flex');
    }

    // 頁面載入觸發定位與初始化
    window.addEventListener('DOMContentLoaded', () => {
      startAutoLocationTracking();
    });
  </script>
</body>
</html>
